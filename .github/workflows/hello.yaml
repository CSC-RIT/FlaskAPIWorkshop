name: Hello

on:
  push:
    branches:
    - main
  
  workflow_dispatch:
    inputs:
      name:
        description: "The name to greet"
        required: false
        default: "World"
        type: string

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
    - name: Hello
      run: echo "Hello ${{ inputs.name }}"